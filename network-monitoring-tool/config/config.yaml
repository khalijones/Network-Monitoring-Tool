# Network Monitoring Tool Configuration
# CCNAv7-based network monitoring configuration

network:
  discovery:
    subnets:
      - "192.168.1.0/24"
      - "10.0.0.0/24"
    ping_timeout: 2
    ping_count: 2
    snmp_community: "public"
    snmp_port: 161
    snmp_timeout: 3
    snmp_retries: 2

monitoring:
  interval_seconds: 300  # 5 minutes
  metrics:
    - name: "cpu_usage"
      oid: "1.3.6.1.4.1.9.9.109.1.1.1.1.7.1"
      threshold: 80
      severity: "warning"
    - name: "memory_usage"
      oid: "1.3.6.1.4.1.9.9.48.1.1.1.5.1"
      threshold: 85
      severity: "critical"
    - name: "interface_status"
      oid: "1.3.6.1.2.1.2.2.1.8"
      threshold: 1  # 1 = up, 2 = down
      severity: "critical"

alerting:
  enabled: true
  channels:
    - type: "webhook"
      url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
      format: "slack"
    - type: "email"
      smtp_host: "smtp.gmail.com"
      smtp_port: 587
      username: "your-email@gmail.com"
      password: "your-app-password"
      to_addresses:
        - "admin@company.com"

flask:
  host: "0.0.0.0"
  port: 5000
  debug: false
